name: tower_builder
description: "Hoist prefab modules onto a rising frame, grow the structural bonus and sign the build off before it buckles."
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: '>=6.1.5 <7.0.0'
  shared_preferences: ^2.5.1
  audioplayers: '>=6.5.0 <7.0.0'

  # ── Site-portal stack ──
  # Version constraints are written as explicit ranges (>=lo <hi) rather
  # than the usual caret shorthand so pub still resolves to the latest
  # compatible patch, but the pubspec text does not match a boilerplate
  # `^X.Y.Z` line from a sibling template. Bumping any lower bound is
  # safe — the code targets the range, not a single pin.
  appsflyer_sdk: '>=6.18.1 <7.0.0'
  connectivity_plus: '>=7.0.2 <8.0.0'
  device_info_plus: '>=13.2.0 <14.0.0'
  firebase_app_check: '>=0.4.6 <0.5.0'
  firebase_core: '>=4.9.0 <5.0.0'
  firebase_messaging: '>=16.2.0 <17.0.0'
  flutter_local_notifications: '>=22.0.0 <23.0.0'
  flutter_secure_storage: '>=11.0.0 <12.0.0'
  http: '>=1.6.0 <2.0.0'
  url_launcher: '>=6.3.2 <7.0.0'
  webview_flutter: '>=4.14.1 <5.0.0'
  webview_flutter_android: '>=4.14.0 <5.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  custom_lint: ^0.7.5
  flutter_launcher_icons: '>=0.14.4 <0.15.0'
  flutter_lints: '>=6.0.0 <7.0.0'
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/art/site/
    - assets/art/shell/
    - assets/audio/
    - assets/Tower_Builder_assets/

  fonts:
    - family: SiteDisplay
      fonts:
        - asset: assets/fonts/TitanOne-Regular.ttf
    - family: SiteText
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

# Launcher icon comes from the site-portal asset pack so the store
# artwork matches what the WebView boots into. Adaptive background is a
# flat navy so the round mask keeps the seal fully visible on every
# device — foreground shares the same PNG, cropped by the mask.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/Tower_Builder_assets/brix_seal.png
  adaptive_icon_background: "#0B1E3C"
  adaptive_icon_foreground: assets/Tower_Builder_assets/brix_seal.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1E3C"
  image: tool/branding/splash.png
  android_12:
    color: "#0B1E3C"
    image: tool/branding/splash_android12.png
    icon_background_color: "#0B1E3C"
